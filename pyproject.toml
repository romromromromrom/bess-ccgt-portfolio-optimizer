[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bess-ccgt-portfolio-optimizer"
version = "0.1.0"
description = "Multi-asset energy & ancillary services MILP optimizer (technical demonstrator)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyomo>=6.7",
    "highspy>=1.7",
    "streamlit>=1.35",
    "boto3>=1.34",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: boots the full Streamlit app; deselect with -m 'not slow'",
]
