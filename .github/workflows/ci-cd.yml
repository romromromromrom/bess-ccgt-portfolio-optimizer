name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t energy-portfolio-optimizer:${{ github.sha }} .

      # The demonstrator is deliberately deployable to a single free-tier
      # instance that is stopped between sessions to keep the bill near zero.
      # So a missing deploy target is the normal state, not a failure: gate the
      # deployment on the secret existing and report a skip, rather than
      # letting every push to main go red.
      - name: Check whether a deploy target is configured
        id: target
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EC2_HOST is not set - image built and verified, deployment skipped."
          fi

      # Deploy kept intentionally simple for a demonstrator: SSH in, pull main,
      # rebuild, restart. No registry/ECR for a single-instance deployment.
      - name: Deploy to EC2 over SSH
        if: steps.target.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd ~/energy-portfolio-optimizer
            git pull origin main
            docker compose down
            docker compose up -d --build
